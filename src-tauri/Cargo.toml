[package]
name="logstudio-desktop"
version="1.0.0"
edition="2021"
publish=false
license.workspace=true
repository.workspace=true
[build-dependencies]
tauri-build={version="=2.7.1",features=[]}
[dependencies]
logstudio-core={path="../core"}
logstudio-extras={path="../extras",optional=true}
serde.workspace=true
serde_json.workspace=true
tauri={version="=2.12.1",features=[]}
tauri-plugin-dialog="=2.8.1"
tauri-plugin-wdio-webdriver={version="=1.4.0",optional=true}
[dev-dependencies]
tempfile.workspace=true
[features]
default=["custom-protocol"]
custom-protocol=["tauri/custom-protocol"]
qa=["dep:tauri-plugin-wdio-webdriver"]
# App extensions (extras/), for builds that are not released.
extras=["dep:logstudio-extras"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2="=0.6.4"
objc2-app-kit={version="=0.3.2",default-features=false,features=["std","NSPasteboard","NSApplication","NSResponder"]}
objc2-foundation={version="=0.3.2",default-features=false,features=["std","NSArray","NSDictionary","NSString","NSURL","NSValue"]}
